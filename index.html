<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agenda de Clientes</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-cadastrar {
      width: 100%;
      background: #168f5b;
      color: white;
      font-weight: bold;
    }

    .btn-cadastrar:hover {
      background: #117747;
    }

    .cliente {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .cliente:last-child {
      border-bottom: none;
    }

    .cliente-info {
      flex: 1;
    }

    .cliente-nome {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .cliente-telefone {
      color: #666;
      font-size: 14px;
    }

    .btn-excluir {
      background: #dc3545;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
    }

    .btn-excluir:hover {
      background: #b52a37;
    }

    .vazio {
      text-align: center;
      color: #777;
      padding: 20px 0;
    }

    .status {
      text-align: center;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .carregando {
      color: #666;
    }

    .erro {
      color: #dc3545;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📋 Agenda de Clientes</h1>

    <!-- CADASTRO -->
    <div class="card">

      <h2>Novo cliente</h2>

      <input
        type="text"
        id="nome"
        placeholder="Nome do cliente"
      >

      <input
        type="tel"
        id="telefone"
        placeholder="Telefone"
      >

      <button
        class="btn-cadastrar"
        onclick="cadastrarCliente()"
      >
        Cadastrar cliente
      </button>

    </div>

    <!-- LISTA -->
    <div class="card">

      <h2>Clientes</h2>

      <div id="status" class="status carregando">
        Carregando clientes...
      </div>

      <div id="listaClientes"></div>

    </div>

  </div>


  <script>

    // ============================================================
    // SUPABASE
    // ============================================================

    const SUPABASE_URL =
      "https://zomcrieauwncpfxefjau.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_HNDHgfM1mX-UHbUuApEvbg_x8xvEd4u";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // ============================================================
    // CARREGAR CLIENTES
    // ============================================================

    async function carregarClientes() {

      const lista =
        document.getElementById("listaClientes");

      const status =
        document.getElementById("status");

      status.textContent =
        "Carregando clientes...";

      status.className =
        "status carregando";

      const { data, error } =
        await supabaseClient
          .from("clientes")
          .select("*")
          .order("nome", { ascending: true });


      if (error) {

        console.error(error);

        status.textContent =
          "Erro ao carregar clientes: " +
          error.message;

        status.className =
          "status erro";

        return;
      }


      lista.innerHTML = "";


      if (!data || data.length === 0) {

        status.textContent = "";

        lista.innerHTML =
          '<div class="vazio">Nenhum cliente cadastrado.</div>';

        return;
      }


      status.textContent =
        data.length +
        (data.length === 1
          ? " cliente cadastrado"
          : " clientes cadastrados");


      data.forEach(cliente => {

        const div =
          document.createElement("div");

        div.className = "cliente";


        const info =
          document.createElement("div");

        info.className =
          "cliente-info";


        const nome =
          document.createElement("div");

        nome.className =
          "cliente-nome";

        nome.textContent =
          cliente.nome || "Sem nome";


        const telefone =
          document.createElement("div");

        telefone.className =
          "cliente-telefone";

        telefone.textContent =
          cliente.telefone || "Sem telefone";


        info.appendChild(nome);
        info.appendChild(telefone);


        // BOTÃO EXCLUIR
        const botaoExcluir =
          document.createElement("button");

        botaoExcluir.className =
          "btn-excluir";

        botaoExcluir.textContent =
          "Excluir";


        botaoExcluir.onclick =
          function() {

            excluirCliente(
              cliente.id,
              cliente.nome
            );

          };


        div.appendChild(info);

        div.appendChild(botaoExcluir);

        lista.appendChild(div);

      });

    }


    // ============================================================
    // CADASTRAR CLIENTE
    // ============================================================

    async function cadastrarCliente() {

      const nomeInput =
        document.getElementById("nome");

      const telefoneInput =
        document.getElementById("telefone");


      const nome =
        nomeInput.value.trim();

      const telefone =
        telefoneInput.value.trim();


      if (!nome) {

        alert(
          "Digite o nome do cliente."
        );

        nomeInput.focus();

        return;
      }


      const { error } =
        await supabaseClient
          .from("clientes")
          .insert([
            {
              nome: nome,
              telefone: telefone
            }
          ]);


      if (error) {

        console.error(error);

        alert(
          "Erro ao cadastrar o cliente:\n\n" +
          error.message
        );

        return;
      }


      alert(
        "Cliente cadastrado com sucesso!"
      );


      nomeInput.value = "";
      telefoneInput.value = "";


      await carregarClientes();

    }


    // ============================================================
    // EXCLUIR CLIENTE
    // ============================================================

    async function excluirCliente(id, nome) {

      const confirmar =
        confirm(
          `Tem certeza que deseja excluir o cliente "${nome}"?`
        );


      if (!confirmar) {

        return;

      }


      const { error } =
        await supabaseClient
          .from("clientes")
          .delete()
          .eq("id", id);


      if (error) {

        console.error(error);

        alert(
          "Erro ao excluir o cliente:\n\n" +
          error.message
        );

        return;

      }


      alert(
        `"${nome}" foi excluído com sucesso.`
      );


      await carregarClientes();

    }


    // ============================================================
    // INICIAR
    // ============================================================

    carregarClientes();

  </script>

</body>
</html>
