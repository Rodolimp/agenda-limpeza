<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agenda de Limpeza</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6fa;
      color: #172033;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitulo {
      color: #667085;
      margin-bottom: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 900px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      border: 1px solid #ddd;
    }

    .numero {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .descricao {
      color: #667085;
      font-size: 18px;
    }

    .formulario {
      background: white;
      padding: 25px;
      border-radius: 16px;
      max-width: 850px;
      border: 1px solid #ddd;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #mensagem {
      margin-top: 15px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>Agenda de Limpeza</h1>

  <div class="subtitulo">
    Controle de lojas, próximas limpezas e vencimentos
  </div>

  <div class="grid">

    <div class="card">
      <div class="numero" id="totalClientes">0</div>
      <div class="descricao">Clientes cadastrados</div>
    </div>

    <div class="card">
      <div class="numero">0</div>
      <div class="descricao">Limpezas nos próximos 7 dias</div>
    </div>

    <div class="card">
      <div class="numero">0</div>
      <div class="descricao">Atrasadas</div>
    </div>

    <div class="card">
      <div class="numero">R$ 0,00</div>
      <div class="descricao">Valor previsto nos próximos 30 dias</div>
    </div>

    <div class="card">
      <div class="numero" id="totalRio">0</div>
      <div class="descricao">Lojas em Rio das Ostras</div>
    </div>

    <div class="card">
      <div class="numero">R$ 0,00</div>
      <div class="descricao">Valor previsto para a semana</div>
    </div>

    <div class="card">
      <div class="numero" id="totalMacae">0</div>
      <div class="descricao">Lojas em Macaé</div>
    </div>

    <div class="card">
      <div class="numero">0</div>
      <div class="descricao">Avulsos</div>
    </div>

  </div>

  <div class="formulario">

    <h2>Cadastrar cliente</h2>

    <label>Loja / cliente</label>
    <input id="nome" type="text" placeholder="Ex.: Loja Central">

    <label>Telefone</label>
    <input id="telefone" type="text" placeholder="99999-9999">

    <label>Cidade</label>
    <input id="cidade" type="text" placeholder="Ex.: Macaé">

    <label>Endereço</label>
    <input id="endereco" type="text" placeholder="Endereço da loja">

    <button id="btnCadastrar" onclick="cadastrarCliente()">
      Cadastrar cliente
    </button>

    <div id="mensagem"></div>

  </div>


<script>

  // ==========================================
  // COLOQUE AQUI OS DADOS DO SEU SUPABASE
  // ==========================================

  const SUPABASE_URL = "COLE_AQUI_A_URL_DO_SEU_PROJETO";

  const SUPABASE_ANON_KEY = "COLE_AQUI_A_CHAVE_ANON_DO_SEU_PROJETO";


  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  // ==========================================
  // CARREGAR CLIENTES
  // ==========================================

  async function carregarClientes() {

    const { data, error } = await supabaseClient
      .from("Clientes")
      .select("*");

    if (error) {
      console.error("Erro ao buscar clientes:", error);
      return;
    }

    console.log("Clientes encontrados:", data);

    document.getElementById("totalClientes").textContent =
      data.length;

    // Conta lojas em Rio das Ostras
    const rio = data.filter(cliente =>
      String(cliente.Cidade || "")
        .toLowerCase()
        .includes("rio das ostras")
    );

    document.getElementById("totalRio").textContent =
      rio.length;

    // Conta lojas em Macaé
    const macae = data.filter(cliente =>
      String(cliente.Cidade || "")
        .toLowerCase()
        .includes("maca")
    );

    document.getElementById("totalMacae").textContent =
      macae.length;
  }


  // ==========================================
  // CADASTRAR CLIENTE
  // ==========================================

  async function cadastrarCliente() {

    const nome = document.getElementById("nome").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const cidade = document.getElementById("cidade").value.trim();
    const endereco = document.getElementById("endereco").value.trim();

    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("btnCadastrar");

    if (!nome) {
      mensagem.textContent = "Digite o nome da loja.";
      return;
    }

    botao.disabled = true;
    mensagem.textContent = "Cadastrando...";

    const { error } = await supabaseClient
      .from("Clientes")
      .insert([
        {
          Nome: nome,
          Telefone: telefone,
          Cidade: cidade,
          Endereço: endereco
        }
      ]);

    if (error) {

      console.error(error);

      mensagem.textContent =
        "Erro ao cadastrar: " + error.message;

      botao.disabled = false;
      return;
    }

    mensagem.textContent =
      "Cliente cadastrado com sucesso!";

    document.getElementById("nome").value = "";
    document.getElementById("telefone").value = "";
    document.getElementById("cidade").value = "";
    document.getElementById("endereco").value = "";

    await carregarClientes();

    botao.disabled = false;
  }


  // ==========================================
  // INICIAR
  // ==========================================

  carregarClientes();

</script>

</body>
</html>
