<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agenda de Clientes</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-cadastrar {
      width: 100%;
      background: #168f5b;
      color: white;
      font-weight: bold;
    }

    .btn-cadastrar:hover {
      background: #117747;
    }

    .btn-clientes {
      width: 100%;
      background: #2563eb;
      color: white;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .cliente {
      padding: 16px 0;
      border-bottom: 1px solid #eee;
    }

    .cliente:last-child {
      border-bottom: none;
    }

    .cliente-nome {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .cliente-info {
      color: #555;
      font-size: 14px;
      line-height: 1.7;
    }

    .btn-excluir {
      background: #dc3545;
      color: white;
      margin-top: 10px;
      font-weight: bold;
    }

    .vazio {
      text-align: center;
      color: #777;
      padding: 20px 0;
    }

    .status {
      text-align: center;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .carregando {
      color: #666;
    }

    .sucesso {
      color: #168f5b;
    }

    .erro {
      color: #dc3545;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📋 Agenda de Clientes</h1>

  <!-- ============================= -->
  <!-- CADASTRO -->
  <!-- ============================= -->

  <div class="card">

    <h2>Novo cliente</h2>

    <label>Nome *</label>
    <input
      type="text"
      id="nome"
      placeholder="Nome do cliente"
    >

    <label>Telefone</label>
    <input
      type="tel"
      id="telefone"
      placeholder="Telefone"
    >

    <label>Cidade</label>
    <input
      type="text"
      id="cidade"
      placeholder="Cidade"
    >

    <label>Endereço</label>
    <input
      type="text"
      id="endereco"
      placeholder="Endereço"
    >

    <label>Data do agendamento *</label>
    <input
      type="date"
      id="data_agendamento"
    >

    <label>Horário</label>
    <input
      type="time"
      id="horario"
    >

    <label>Periodicidade *</label>
    <select id="periodicidade">
      <option value="">Selecione</option>
      <option value="1">1</option>
      <option value="7">7 dias</option>
      <option value="15">15 dias</option>
      <option value="30">30 dias</option>
      <option value="60">60 dias</option>
      <option value="90">90 dias</option>
    </select>

    <label>Data de pagamento</label>
    <input
      type="date"
      id="data_pagamento"
    >

    <label>Valor</label>
    <input
      type="number"
      id="valor"
      placeholder="0,00"
      step="0.01"
      min="0"
    >

    <label>Tipo de serviço *</label>
    <input
      type="text"
      id="tipo_servico"
      placeholder="Ex.: Limpeza residencial"
    >

    <button
      class="btn-cadastrar"
      onclick="cadastrarCliente()"
    >
      Cadastrar cliente
    </button>

  </div>


  <!-- ============================= -->
  <!-- CLIENTES -->
  <!-- ============================= -->

  <div class="card">

    <h2>Clientes cadastrados</h2>

    <button
      class="btn-clientes"
      onclick="carregarClientes()"
    >
      👥 Ver clientes cadastrados
    </button>

    <div
      id="status"
      class="status"
    ></div>

    <div id="listaClientes"></div>

  </div>

</div>


<script>

  // ============================================================
  // SUPABASE
  // ============================================================

  const SUPABASE_URL =
    "https://zomcrieauwncpfxefjau.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_HNDHgfM1mX-UHbUuApEvbg_x8xvEd4u";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // ============================================================
  // FUNÇÃO PARA MOSTRAR STATUS
  // ============================================================

  function mostrarStatus(texto, tipo) {

    const status =
      document.getElementById("status");

    status.textContent = texto;

    status.className =
      "status " + tipo;
  }


  // ============================================================
  // CARREGAR CLIENTES
  // ============================================================

  async function carregarClientes() {

    const lista =
      document.getElementById("listaClientes");

    lista.innerHTML = "";

    mostrarStatus(
      "Carregando clientes...",
      "carregando"
    );


    const { data, error } =
      await supabaseClient
        .from("clientes")
        .select("*")
        .order("nome", {
          ascending: true
        });


    if (error) {

      console.error(error);

      mostrarStatus(
        "Erro ao carregar clientes: " +
        error.message,
        "erro"
      );

      return;
    }


    if (!data || data.length === 0) {

      mostrarStatus(
        "",
        ""
      );

      lista.innerHTML =
        '<div class="vazio">' +
        'Nenhum cliente cadastrado.' +
        '</div>';

      return;
    }


    mostrarStatus(
      data.length +
      (
        data.length === 1
          ? " cliente cadastrado"
          : " clientes cadastrados"
      ),
      "sucesso"
    );


    data.forEach(cliente => {

      const div =
        document.createElement("div");

      div.className = "cliente";


      // NOME

      const nome =
        document.createElement("div");

      nome.className =
        "cliente-nome";

      nome.textContent =
        cliente.nome || "Sem nome";


      // INFORMAÇÕES

      const info =
        document.createElement("div");

      info.className =
        "cliente-info";


      let texto = "";


      if (cliente.telefone) {
        texto +=
          "📞 " +
          cliente.telefone +
          "<br>";
      }


      if (cliente.cidade) {
        texto +=
          "📍 " +
          cliente.cidade +
          "<br>";
      }


      if (cliente.endereco) {
        texto +=
          "🏠 " +
          cliente.endereco +
          "<br>";
      }


      if (cliente.data_agendamento) {

        const dataAgendamento =
          formatarData(
            cliente.data_agendamento
          );

        texto +=
          "📅 Agendamento: " +
          dataAgendamento;

        if (cliente.horario) {
          texto +=
            " às " +
            cliente.horario.substring(0, 5);
        }

        texto += "<br>";
      }


      if (cliente.tipo_servico) {

        texto +=
          "🧹 Serviço: " +
          cliente.tipo_servico +
          "<br>";
      }


      if (cliente.periodicidade) {

        texto +=
          "🔄 Periodicidade: " +
          cliente.periodicidade +
          " dias<br>";
      }


      if (cliente.valor !== null &&
          cliente.valor !== undefined) {

        texto +=
          "💰 Valor: R$ " +
          Number(cliente.valor)
            .toFixed(2)
            .replace(".", ",") +
          "<br>";
      }


      if (cliente.data_pagamento) {

        texto +=
          "💳 Pagamento: " +
          formatarData(
            cliente.data_pagamento
          );
      }


      info.innerHTML = texto;


      // BOTÃO EXCLUIR

      const botaoExcluir =
        document.createElement("button");

      botaoExcluir.className =
        "btn-excluir";

      botaoExcluir.textContent =
        "Excluir";


      botaoExcluir.onclick =
        function() {

          excluirCliente(
            cliente.id,
            cliente.nome
          );

        };


      div.appendChild(nome);

      div.appendChild(info);

      div.appendChild(
        botaoExcluir
      );

      lista.appendChild(div);

    });

  }


  // ============================================================
  // FORMATAR DATA
  // ============================================================

  function formatarData(data) {

    if (!data) {
      return "";
    }

    const partes =
      data.split("-");

    if (partes.length !== 3) {
      return data;
    }

    return (
      partes[2] +
      "/" +
      partes[1] +
      "/" +
      partes[0]
    );
  }


  // ============================================================
  // CADASTRAR CLIENTE
  // ============================================================

  async function cadastrarCliente() {

    const nome =
      document
        .getElementById("nome")
        .value
        .trim();

    const telefone =
      document
        .getElementById("telefone")
        .value
        .trim();

    const cidade =
      document
        .getElementById("cidade")
        .value
        .trim();

    const endereco =
      document
        .getElementById("endereco")
        .value
        .trim();

    const data_agendamento =
      document
        .getElementById("data_agendamento")
        .value;

    const horario =
      document
        .getElementById("horario")
        .value;

    const periodicidade =
      document
        .getElementById("periodicidade")
        .value;

    const data_pagamento =
      document
        .getElementById("data_pagamento")
        .value;

    const valor =
      document
        .getElementById("valor")
        .value;

    const tipo_servico =
      document
        .getElementById("tipo_servico")
        .value
        .trim();


    // ==========================
    // VALIDAÇÕES
    // ==========================

    if (!nome) {

      alert(
        "Digite o nome do cliente."
      );

      document
        .getElementById("nome")
        .focus();

      return;
    }


    if (!data_agendamento) {

      alert(
        "Informe a data do agendamento."
      );

      return;
    }


    if (!periodicidade) {

      alert(
        "Informe a periodicidade."
      );

      return;
    }


    if (!tipo_servico) {

      alert(
        "Informe o tipo de serviço."
      );

      return;
    }


    mostrarStatus(
      "Cadastrando cliente...",
      "carregando"
    );


    // ==========================
    // INSERIR NO SUPABASE
    // ==========================

    const { data, error } =
      await supabaseClient
        .from("clientes")
        .insert([
          {
            nome:
              nome,

            telefone:
              telefone || null,

            cidade:
              cidade || null,

            endereco:
              endereco || null,

            data_agendamento:
              data_agendamento,

            horario:
              horario || null,

            periodicidade:
              Number(periodicidade),

            data_pagamento:
              data_pagamento || null,

            valor:
              valor
                ? Number(valor)
                : null,

            tipo_servico:
              tipo_servico,

            user_id:
              null
          }
        ])
        .select();


    if (error) {

      console.error(error);

      mostrarStatus(
        "Erro ao cadastrar.",
        "erro"
      );

      alert(
        "Erro ao cadastrar o cliente:\n\n" +
        error.message
      );

      return;
    }


    // ==========================
    // SUCESSO
    // ==========================

    alert(
      "Cliente cadastrado com sucesso!"
    );


    // LIMPAR FORMULÁRIO

    document
      .getElementById("nome")
      .value = "";

    document
      .getElementById("telefone")
      .value = "";

    document
      .getElementById("cidade")
      .value = "";

    document
      .getElementById("endereco")
      .value = "";

    document
      .getElementById("data_agendamento")
      .value = "";

    document
      .getElementById("horario")
      .value = "";

    document
      .getElementById("periodicidade")
      .value = "";

    document
      .getElementById("data_pagamento")
      .value = "";

    document
      .getElementById("valor")
      .value = "";

    document
      .getElementById("tipo_servico")
      .value = "";


    // ATUALIZAR LISTA

    await carregarClientes();

  }


  // ============================================================
  // EXCLUIR CLIENTE
  // ============================================================

  async function excluirCliente(id, nome) {

    const confirmar =
      confirm(
        'Tem certeza que deseja excluir "' +
        nome +
        '"?'
      );


    if (!confirmar) {
      return;
    }


    mostrarStatus(
      "Excluindo cliente...",
      "carregando"
    );


    const { error } =
      await supabaseClient
        .from("clientes")
        .delete()
        .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "Erro ao excluir o cliente:\n\n" +
        error.message
      );

      return;
    }


    alert(
      '"' +
      nome +
      '" foi excluído com sucesso.'
    );


    await carregarClientes();

  }


  // ============================================================
  // INICIAR
  // ============================================================

  // Não carrega automaticamente.
  // O usuário pode clicar em
  // "Ver clientes cadastrados".

</script>

</body>
</html>
